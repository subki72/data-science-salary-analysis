name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint & Typecheck Tools
        run: pip install ruff==0.17.6 flake8==7.3.0 mypy==1.15.0

      - name: Run Ruff Check & Format Verification
        run: |
          python -m ruff check src tests main.py
          python -m ruff format --check src tests main.py

      - name: Run Flake8
        run: python -m flake8 --max-line-length=120 src tests main.py

      - name: Run Mypy Typecheck
        run: python -m mypy src main.py --ignore-missing-imports

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.0.3 pytest-cov==7.1.0

      - name: Run Pytest with Coverage Gate
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=75

      - name: Verify CLI Health & Demo
        run: |
          python main.py --health
          python main.py --demo --format json > /dev/null

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Hardened Docker Image
        run: docker build -t ds-salary-analytics:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ds-salary-analytics:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
