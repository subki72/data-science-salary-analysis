name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-verify:
    name: Verify Release Artifact & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.0.3 pytest-cov==7.1.0

      - name: Run Release Verification Suite
        run: python -m pytest tests/ -v --cov=src --cov-fail-under=75

      - name: Build Release Docker Image
        run: docker build -t ds-salary-analytics:${{ github.ref_name }} .
