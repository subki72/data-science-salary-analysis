services:
  salary-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ds-salary-analytics
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      SALARY_APP_ENV: production
      SALARY_DB_PATH: ":memory:"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
